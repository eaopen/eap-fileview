name: Publish stable runtime base image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve stable dependency tree
        run: mvn -B -pl server -am -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Java 21 LibreOffice and dependency base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/eaopen/eap-fileview-base:java21-lo-r1
          cache-from: type=gha,scope=fileview-stable-base
          cache-to: type=gha,mode=max,scope=fileview-stable-base
