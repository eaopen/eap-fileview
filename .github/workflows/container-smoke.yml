name: Smoke eap-fileview container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      KK_BASE_URL: http://localhost:18012/fileview/
      KK_TRUST_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Start published image with the deployment configuration
        run: docker compose up -d --pull always --wait --wait-timeout 180
      - name: Verify health through the published port
        run: curl -fsS http://127.0.0.1:18012/fileview/actuator/health | jq -e '.status == "UP"'
      - if: failure()
        run: docker compose logs --tail 75
      - if: always()
        run: docker compose down --volumes
