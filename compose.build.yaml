# Optional local development build; never retag the released 3.0.2 image.
services:
  eap-fileview:
    image: ${EAP_FILEVIEW_BUILD_IMAGE:-eap-fileview:dev}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${EAP_FILEVIEW_VERSION:-3.0.3}
